[project]
name = "gargantua"
version = "0.1.0"
description = "GARGANTUA preprocessing: video -> packed space-time volume (.gvol) with evidence field, worldlines and clip analysis."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "opencv-python-headless==4.14.0.94",
]

[project.scripts]
gargantua = "gargantua.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PERF", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF046"]  # RUF046: int(round(x)) is deliberate - x is often a numpy scalar

[tool.pytest.ini_options]
testpaths = ["tests"]
